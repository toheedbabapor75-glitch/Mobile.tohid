<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>گردونه شانس موبایل توحید</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Tahoma,Arial,sans-serif;
    background:linear-gradient(135deg,#111827,#312e81,#7c3aed);
    color:#fff;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:520px;
    min-height:100vh;
    padding:15px 10px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.title{
    font-size:27px;
    font-weight:900;
    text-align:center;
    margin-bottom:5px;
}

.subtitle{
    font-size:15px;
    text-align:center;
    opacity:.9;
    margin-bottom:12px;
}

.wheel-box{
    position:relative;
    width:min(94vw,460px);
    aspect-ratio:1;
}

canvas{
    width:100%;
    height:100%;
    display:block;
}

.pointer{
    position:absolute;
    top:-2px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;

    width:0;
    height:0;

    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-bottom:38px solid #fff;

    filter:drop-shadow(0 4px 4px #000);
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    width:82px;
    height:82px;

    border-radius:50%;

    background:#080808;
    color:#f4c542;

    border:7px solid #d4af37;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:17px;
    font-weight:900;

    box-shadow:0 5px 20px #0008;
}

#spin{
    margin-top:15px;

    border:0;
    border-radius:18px;

    padding:15px 28px;

    font-size:19px;
    font-weight:900;

    background:#f4c542;
    color:#111;

    cursor:pointer;

    box-shadow:0 6px 0 #9a7410;
}

#spin:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #9a7410;
}

#spin:disabled{
    opacity:.6;
}

/* نتیجه تمام صفحه */

#resultScreen{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    background:rgba(5,5,20,.97);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:99999;
}

.resultBox{
    width:100%;
    max-width:500px;

    background:#fff;
    color:#111;

    border-radius:30px;

    padding:35px 20px;

    text-align:center;

    box-shadow:0 20px 70px #000;

    animation:showResult .45s ease;
}

@keyframes showResult{
    from{
        transform:scale(.5);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.resultTitle{
    font-size:30px;
    font-weight:900;
    margin-bottom:20px;
}

.resultPrize{
    color:#7c3aed;

    font-size:clamp(24px,7vw,38px);

    font-weight:900;

    line-height:1.7;

    margin:15px 0;
}

.resultShop{
    font-size:21px;
    font-weight:900;
    margin-top:15px;
}

.close{
    width:100%;

    margin-top:25px;

    border:0;
    border-radius:16px;

    padding:14px;

    background:#7c3aed;
    color:white;

    font-size:18px;
    font-weight:900;

    cursor:pointer;
}

@media(max-height:700px){

    .title{
        font-size:22px;
    }

    .subtitle{
        margin-bottom:4px;
    }

    .wheel-box{
        width:min(82vh,90vw);
    }

    #spin{
        margin-top:7px;
        padding:12px 25px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        📱 موبایل توحید
    </div>

    <div class="subtitle">
        🎁 گردونه شانس ویژه مشتریان
    </div>

    <div class="wheel-box">

        <div class="pointer"></div>

        <canvas id="wheel" width="900" height="900"></canvas>

        <div class="center">
            بچرخون!
        </div>

    </div>

    <button id="spin">
        🎡 چرخاندن گردونه
    </button>

</div>


<!-- نتیجه -->

<div id="resultScreen">

    <div class="resultBox">

        <div class="resultTitle">
            🎉 تبریک! 🎉
        </div>

        <div class="resultPrize" id="resultPrize">
        </div>

        <div class="resultShop">
            📱 موبایل توحید
        </div>

        <button class="close" onclick="closeResult()">
            متوجه شدم
        </button>

    </div>

</div>


<script>

const labels = [

    "🎁 ۵٪ تخفیف",

    "🎁 ۱۰٪ تخفیف",

    "🎁 ۱۵٪ تخفیف",

    "🎁 ۲۰٪ تخفیف",

    "🎁 ۲۵٪ تخفیف",

    "🍀 شانس مجدد",

    "🛡️ گلس رایگان با خرید قاب",

    "🔌 کابل رایگان با خرید پاوربانک",

    "🎧 هندزفری رایگان با خرید ساعت هوشمند",

    "📱 گلس رایگان با خرید گوشی"

];


const colors = [

    "#ef4444",
    "#f97316",
    "#eab308",
    "#22c55e",
    "#06b6d4",
    "#3b82f6",
    "#6366f1",
    "#8b5cf6",
    "#d946ef",
    "#ec4899"

];


const canvas =
    document.getElementById("wheel");

const ctx =
    canvas.getContext("2d");

const spinBtn =
    document.getElementById("spin");

const resultScreen =
    document.getElementById("resultScreen");

const resultPrize =
    document.getElementById("resultPrize");


const n = labels.length;

const arc =
    2 * Math.PI / n;

let rotation = 0;

let spinning = false;


function draw(){

    ctx.clearRect(
        0,
        0,
        900,
        900
    );


    const cx = 450;

    const cy = 450;

    const r = 420;


    for(let i=0;i<n;i++){

        const start =
            rotation +
            i * arc -
            Math.PI / 2;

        const end =
            start + arc;


        ctx.beginPath();

        ctx.moveTo(cx,cy);

        ctx.arc(
            cx,
            cy,
            r,
            start,
            end
        );

        ctx.closePath();


        ctx.fillStyle =
            colors[i];

        ctx.fill();


        ctx.strokeStyle =
            "#fff";

        ctx.lineWidth = 7;

        ctx.stroke();


        ctx.save();

        ctx.translate(
            cx,
            cy
        );

        ctx.rotate(
            start + arc / 2
        );


        ctx.textAlign =
            "right";

        ctx.textBaseline =
            "middle";

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 22px Tahoma";

        ctx.shadowColor =
            "#000";

        ctx.shadowBlur = 5;


        ctx.fillText(
            labels[i],
            r - 25,
            0
        );


        ctx.restore();

    }


    /* مرکز گردونه */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        82,
        0,
        2 * Math.PI
    );

    ctx.fillStyle =
        "#080808";

    ctx.fill();


    ctx.lineWidth = 8;

    ctx.strokeStyle =
        "#d4af37";

    ctx.stroke();


    ctx.fillStyle =
        "#f4c542";

    ctx.font =
        "bold 28px Tahoma";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        "توحید",
        cx,
        cy
    );

}


draw();


function spin(){

    if(spinning)
        return;


    spinning = true;

    spinBtn.disabled =
        true;


    const winner =
        Math.floor(
            Math.random() * n
        );


    const turns =
        6 + Math.random() * 2;


    const target =
        -winner * arc -
        arc / 2;


    const current =
        rotation %
        (2 * Math.PI);


    const final =
        rotation +
        turns * 2 * Math.PI +
        (target - current);


    const start =
        rotation;


    const duration =
        5200;


    const t0 =
        performance.now();


    function anim(t){

        const p =
            Math.min(
                1,
                (t - t0) / duration
            );


        const e =
            1 -
            Math.pow(
                1 - p,
                4
            );


        rotation =
            start +
            (final - start) * e;


        draw();


        if(p < 1){

            requestAnimationFrame(
                anim
            );

        }else{

            rotation =
                rotation %
                (2 * Math.PI);


            spinning = false;


            spinBtn.disabled =
                false;


            showResult(
                labels[winner]
            );

        }

    }


    requestAnimationFrame(
        anim
    );

}


function showResult(prize){

    resultPrize.textContent =
        prize;

    resultScreen.style.display =
        "flex";

}


function closeResult(){

    resultScreen.style.display =
        "none";

}


spinBtn.addEventListener(
    "click",
    spin
);

</script>

</body>
</html>
