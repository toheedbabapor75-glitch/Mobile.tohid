<h1>🎁 گردونه شانس موبایل توحید</h1>
<div class="sub">بچرخون ببین شانس با تو یاره! 🍀</div>
<div class="wheelbox">
<div class="pointer"></div>
<canvas id="wheel" width="900" height="900"></canvas>
</div>
<button id="spin">بچرخون 🎉</button>
<div id="result" class="result"></div>
<div class="small">هر نفر یک بار • اعتبار جایزه ۷۲ ساعت • تخفیف‌ها قابل جمع با سایر تخفیف‌ها نیستند • </div>
</div>
<script>
const labels=['۵٪ تخفیف','۱۰٪ تخفیف','۱۵٪ تخفیف','۲۰٪ تخفیف','۳۰٪ تخفیف آویز گوشی','شانس مجدد','گلس رایگان با خرید قاب','کابل رایگان با خرید پاوربانک','هندزفری رایگان با خرید ساعت هوشمند','گلس رایگان با خرید قاب'];
const colors=['#D4AF37','#F39C12','#E74C3C','#C0392B','#27AE60','#1F5AA6','#16A085','#2980B9','#8E44AD','#2471A3'];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
const spinBtn=document.getElementById('spin'), result=document.getElementById('result');
let rotation=0, spinning=false;
const n=labels.length, arc=2*Math.PI/n;
function draw(){
 ctx.clearRect(0,0,900,900);
 const cx=450,cy=450,r=420;
 for(let i=0;i<n;i++){
   const a0=rotation+i*arc-Math.PI/2, a1=a0+arc;
   ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();
   ctx.fillStyle=colors[i];ctx.fill();ctx.lineWidth=7;ctx.strokeStyle="#111";ctx.stroke();
   ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+arc/2);
   ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="bold 28px Tahoma";
   let t=labels[i]; if(t.length>23){ctx.font="bold 22px Tahoma";}
   ctx.shadowColor="#000";ctx.shadowBlur=5;ctx.fillText(t,r-24,8);ctx.restore();
 }
 ctx.beginPath();ctx.arc(cx,cy,82,0,2*Math.PI);ctx.fillStyle="#080808";ctx.fill();ctx.lineWidth=8;ctx.strokeStyle="#d4af37";ctx.stroke();
 ctx.fillStyle="#f4c542";ctx.font="bold 28px Tahoma";ctx.textAlign="center";ctx.fillText("توحید",cx,10+cy);
}
draw();
function spin(){
 if(spinning)return; spinning=true;spinBtn.disabled=true;result.style.display="none";
 const winner=Math.floor(Math.random()*n);
 const turns=6+Math.random()*2;
 const target=-winner*arc-arc/2;
 const start=rotation;
 const final=start+turns*2*Math.PI+(target-(start%(2*Math.PI)));
 const duration=5200, t0=performance.now();
 function anim(t){
   const p=Math.min(1,(t-t0)/duration), e=1-Math.pow(1-p,4);
   rotation=start+(final-start)*e;draw();
   if(p<1)requestAnimationFrame(anim);else{
     spinning=false;spinBtn.disabled=false;
     result.innerHTML="🎉 نتیجه شما: <strong>"+labels[winner]+"</strong><br><span style='font-size:14px;color:#bbb'>از نتیجه اسکرین‌شات بگیر و برای موبایل توحید دایرکت کن.</span>";
     result.style.display="block";
   }
 }
 requestAnimationFrame(anim);
}
spinBtn.onclick=spin;
</script>
